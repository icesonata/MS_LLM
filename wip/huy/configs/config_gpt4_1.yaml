project: cs-dialogue-eval
storage:
  data_root: data
  object_store: local
llm:
  provider: openai
  model: gpt-4.1
  temperature: 0.0
  max_tokens: 2048
  json_mode: true
pii:
  redact: true
  tool: presidio
telemetry:
  traces: langfuse
  opentelemetry: true
aggregation:
  method: weighted_mean
  stabilization:
    strategy: median_of_n
    n: 3
  calibration:
    enabled: true
    method: isotonic
